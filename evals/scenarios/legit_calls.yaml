- id: verify-grandchild-new-number-no
  lang: "no"
  category: family_impersonation
  difficulty: hard
  expected: verify
  detect_by: null
  tags: [new_number, grandchild, name_fished, no_request_yet]
  notes: >
    "Hi it's me, new number". The grandmother supplies the name herself, there is a cold and bad-reception
    excuse, and a promise to call tomorrow. This is exactly the groundwork of the grandchild scam, but
    nothing is asked yet. The right answer is unsure: verify on the old number.
  chunks:
    - "hei bestemor det er meg da hører du meg det er så dårlig dekning her"
    - "hei hvem er det sa du jeg hører så dårlig på dette øret"
    - "det er meg da barnebarnet ditt jeg har fått nytt nummer mobilen min gikk i stykker"
    - "å er det deg sindre du høres så annerledes ut på telefonen"
    - "ja det er meg jeg er litt forkjøla og jeg sitter på bussen så det skurrer"
    - "lagre dette nummeret da bestemor så skal jeg ringe deg i morgen om en ting"
    - "hva er det du skal ringe om da er det noe som har skjedd"
    - "nei ikke noe farlig jeg ringer i morgen jeg må gå av nå ha det"

- id: verify-bank-callback-given-number-mix
