# Hard negatives: real calls that share surface features with scams.
# 16 x expected: safe (no chunk may be scam), 8 x expected: verify (unsure/scam ok, safe fails).
# All names, numbers, case ids and addresses are invented.

# ---------------------------------------------------------------- SAFE (16)

- id: legit-dnb-fraud-alert-callback-no
  lang: "no"
  category: legit_bank
  difficulty: hard
  expected: safe
  detect_by: null
  tags: [bank, card_block, fraud_alert, no_codes, callback_known_number]
  notes: >
    Real DNB card-fraud team: unknown caller, "suspicious transaction", card blocked. These are the
    classic bank-scam openers. Still safe: no codes, no money moved, no app or remote access, and the
    caller says they never ask for codes and tells her to call the number on the card.
  chunks:
    - "hallo ja hei det er ingrid fra d n b kortsvindel jeg ringer angående en transaksjon på visa korte ditt"
    - "ja hei hva er det som har skjedd nå da er det noe galt med kontoen min"
    - "vi har stoppet et kjøp på fire tusen ni hundre kroner hos en nettbutikk i nederland i natt har du gjort det kjøpet"
    - "nei det har jeg ikke jeg har ikke handlet noe på nettet jeg har ikke det"
    - "da har vi sperret kortet for sikkerhets skyld og du får et nytt i posten i løpet av en uke"
    - "og bare så det er sagt vi kommer aldri til å be om koder bank id eller passord på telefon"
    - "hvis du vil være trygg på at det er oss kan du legge på og ringe nummeret på baksiden av kortet eller sjekke i appen"
    - "ja det gjør jeg nok sønnen min har sagt at jeg skal være forsiktig med sånne telefoner"
    - "det er helt riktig å være forsiktig du ser sperringen under kort i nettbanken også ha en fin dag"

