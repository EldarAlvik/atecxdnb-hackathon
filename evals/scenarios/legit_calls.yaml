- id: legit-grandson-planned-loan-en
  lang: en
  category: legit_family
  difficulty: hard
  expected: safe
  detect_by: null
  tags: [grandchild, loan, money_request, parents_involved, no_urgency]
  notes: >
    Grandson raises a 10 000 kr car loan, so a grandchild is asking for money. Safe because it was agreed
    in person, his parents arranged it, there is no urgency or secrecy, and the money will be handled in
    person at the bank. Unsure is tolerable; scam would wreck a real family call.
  chunks:
    - "hi grandad its oliver mum said i should ring you about the car thing we talked about"
    - "oh hello oliver yes your mother told me all about it on sunday at dinner"
    - "so the used car is forty thousand kroner and i have twenty five saved up like i said"
    - "mum and dad are putting in some and you offered to lend me ten thousand is that still okay"
    - "yes of course we said that at dinner there is no rush at all my boy"
    - "mum is writing up a little paper so i pay you back a thousand a month from my summer job"
    - "no hurry bring the paper when you come at easter and we sort it at the bank together with your mum"
    - "brilliant thanks grandad i will drive you to the shops when i have it love you bye"

