  category: bank_impersonation
  difficulty: medium
  expected: verify
  detect_by: null
  tags: [bank, callback, caller_supplied_number, urgency_mild]
  notes: >
    "Bank fraud department, call us back on this number." Real banks sometimes do this, but a number
    supplied by the caller is also the callback-scam pattern. No codes or transfers yet. The safe advice
    is to call the number on the card instead, so unsure.
  chunks:
    - "hello god dag this is the fraud department at nordea calling for mister hansen please"
    - "ja det er meg hva gjelder det er det noe galt med kontoen min"
    - "we have registered some unusual activity on your account and need you to contact us as soon as possible"
    - "kan du ringe oss tilbake på nummer to to tre fire fem seks sju åtte og oppgi saksnummer ni ni ni en"
    - "hva slags aktivitet er det snakk om jeg har ikke gjort noe spesielt"
    - "i cannot discuss details on this line for your security please call the number i gave you today"
    - "ok jeg skal ringe takk for at du sa ifra"

