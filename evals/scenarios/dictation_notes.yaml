# Dictation-note scenarios: TEXT, not live calls.
# Each scenario is raw voice-to-text output from someone dictating into their
# phone: a note to self, a voice note to a relative, or an SMS / email / letter
# read aloud. Spoken punctuation, misrecognitions and self-corrections are kept.
# The harness feeds them with the call-detector prompt ("Live call transcript so
# far"), so `notes` says what the text actually is.
# 15 pairs: same stem, suffix -no / -en. 8 scam, 4 safe, 3 verify.
# All names, numbers and links are fictional.

# ---------------------------------------------------------------- SCAM (8 pairs)

