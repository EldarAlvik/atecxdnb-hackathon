    - "the bail is 45 thousand kroner in cash and a courier from the court will come to your house this afternoon"
    - "and ben asked that you please don't tell his mother he'll explain himself and there is a gag order on the case"
    - "can i speak to him he's in a holding cell right now but he can call you briefly after the courier has been"

