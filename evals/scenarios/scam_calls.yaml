- id: recovery-bitvantage-en
  lang: en
  category: investment
  difficulty: hard
  expected: scam
  detect_by: 7
  tags: [recovery_scam, prior_victim, correct_details, advance_fee, crypto]
  notes: >
    Recovery scam aimed at a previous victim. Knows platform and loss amount,
    sounds official and careful; the advance "compliance deposit" comes late.
  chunks:
    - "hello mister haugen this is sarah whitfield from the european financial recovery office do you have a moment to talk"
    - "yes what is it about i'm calling about your police report in 2024 about the platform called bitvantage you lost about 180 thousand kroner"
    - "yes that's right it was terrible i'm very sorry to hear that we work with authorities in several countries to trace stolen funds"
    - "how did you get my name your case was on a list shared after an operation in cyprus the people behind bitvantage were arrested"
    - "really that's good news it is and some frozen wallets have been linked to your transactions so you may be eligible for compensation"
    - "i don't want to promise anything but in cases like yours clients usually recover between 70 and 90 percent"
    - "the next step is just paperwork we open a recovery file in your name and the court releases the funds to a custody wallet"
    - "the only thing is the release requires a compliance deposit of 2 percent held by the custodian and refunded with your payout"
    - "that's around 3 600 kroner in bitcoin or usdt i'll guide you and we should do it this week before the window closes"

