  chunks:
    - "hey sweetheart it's me oh hi daniel i was hoping you would call how was your day on the platform"
    - "long day the north sea weather is crazy but your voice makes it better did you go to the cabin with your sister"
    - "yes we went to hemsedal it was lovely i showed her your picture she said you look like a movie star haha"
    - "tell her i said thank you i keep thinking about our plans for christmas in bergen i already looked at hotels"
    - "me too i can't wait my contract ends in three weeks and then i'm all yours but there's a small problem with my salary"
    - "the company pays to my account in the us and the bank has frozen it because of a compliance check it's very stressful"
