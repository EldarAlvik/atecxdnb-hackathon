    - "we have detected that your computer in norway is infected with a virus and hackers are accessing your bank details right now"
    - "oh no what do i do don't worry sir i will fix it please go to your computer open google and type any desk"
    - "a n y d e s k yes download it and tell me the nine digit number that appears on the screen"
    - "ok it says four eight one two two nine seven zero three ok now press accept so i can remove the virus"
    - "now please log in to your dnb online banking so i can check if the hackers took money and don't close the screen"

