# SCAM scenarios set in Norway (2025-2026 patterns). See SCHEMA.md.
# lang "no" is quoted on purpose: unquoted `no` parses as boolean false in YAML 1.1.
# Difficulty: easy 6, medium 9, hard 7. Language: no 12, en 7, mixed 3.

# ---------------------------------------------------------------- EASY

- id: dnb-bankid-code-no
  lang: "no"
  category: bank_impersonation
  difficulty: easy
  expected: scam
  detect_by: 1
  tags: [dnb, bankid, otp, urgency]
  notes: >
    Classic DNB "sikkerhetsavdeling" call. Asks for the BankID code in chunk 1,
    then threatens that the bank will not cover the loss.
  chunks:
    - "ja hallo hei dette er kristian berg fra dnb sin sikkerhetsavdeling vi har sett noe mistenkelig aktivitet på kontoen din"
    - "eh hva for noe vi må stoppe en betaling på 14 tusen nå og da trenger jeg koden fra bankaid brikken din"
    - "eh ok vent litt jeg må finne den ja bare les opp de seks sifrene som står på displayet så stopper vi den"
    - "det er fire sju to eh vent hvorfor trenger du det det er for å bekrefte at det er deg vi må være raske"
    - "hvis vi ikke får koden innen fem minutter så går pengene ut og da kan ikke banken dekke tapet ditt"
    - "ok eh ni en tre takk og nå kommer det en ny kode på sms les den også for meg"

