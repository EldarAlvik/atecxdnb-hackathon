# ---------------------------------------------------------------- HARD

- id: sparebank1-godkjenn-i-appen-no
  lang: "no"
  category: bank_impersonation
  difficulty: hard
  expected: scam
  detect_by: 6
  tags: [sparebank1, app_approval, correct_details, no_trigger_words]
  notes: >
    Caller knows address and a real recent purchase, never asks for a code. The
    ask is "trykk godkjenn i appen", which shows a new device and 48 000 kr.
  chunks:
    - "hallo det er ingrid ja hei ingrid du snakker med thomas fra sparebank 1 sør-norge kundeservice har du et par minutter"
    - "ja det har jeg vel du er kunde hos oss med brukskonto og sparekonto og bor i lyngveien 12 i arendal stemmer det"
    - "ja det stemmer flott vi ringer en del kunder nå fordi vi oppgraderer mobilbanken og noen har fått feil i varslingene"
    - "å ja jeg har ikke merket noe så bra jeg ser at du handlet på rema i går for 389 kroner kjenner du den igjen"
    - "ja det var meg fint da er alt riktig vi skal bare koble telefonen din til den nye løsningen så slipper du trøbbel"
    - "ok hvordan gjør jeg det det er veldig enkelt nå kommer det et varsel i appen og så trykker du bare godkjenn"
    - "eh det står noe om ny enhet og et beløp her 48 tusen ja det er bare en testramme det trekkes ikke noe trykk godkjenn"
    - "jeg er litt usikker det er helt normalt alle kunder gjør dette nå mens jeg er på linja ellers blir appen sperret"

