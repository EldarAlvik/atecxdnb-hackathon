    - "is it emma yes mamma it's me jeg trenger hjelp asap jeg må betale en regning i dag and my bank id doesn't work"
    - "kan du betale den for meg it's 8 750 kroner jeg sender kontonummeret på melding i'll pay you back tomorrow"
    - "eh your voice sounds strange it's the new phone mamma bad connection please bare gjør det nå it's urgent"
    - "account er 9235 41 08816 the name is just my landlord's company and don't call my old number it's broken"

