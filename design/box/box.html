<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--oak:#d9b382;--oak-dark:#c49a66;--face:#f3eee6;--ink:#2b2622}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:16px 0 4px}
  .view{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{font-size:13px;color:var(--muted-foreground,#888);letter-spacing:.04em}
  .wall{width:330px;height:440px;border-radius:var(--radius,10px);display:grid;place-items:center;
        background:linear-gradient(160deg,#efe6d8,#ddd0bd)}

  .scene{perspective:1400px}
  .box{position:relative;width:200px;height:300px;transform-style:preserve-3d}
  .box.angled{transform:rotateY(-28deg) rotateX(6deg)}
  .side,.top{position:absolute;background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 9px),
      linear-gradient(var(--oak),var(--oak-dark))}
  .side{width:70px;height:300px;left:200px;top:0;transform-origin:left center;transform:rotateY(90deg);filter:brightness(.82)}
  .top{width:200px;height:70px;left:0;top:0;transform-origin:center top;transform:rotateX(-90deg);filter:brightness(1.05)}

  .face{position:absolute;inset:0;border-radius:6px;box-sizing:border-box;
      background:radial-gradient(120% 80% at 30% 10%,#fffaf2 0,var(--face) 55%,#e9e2d6 100%);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 30px 50px -20px rgba(60,40,20,.45);
      display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:20px}

  /* the one light */
  .light{--c:#5fd27a;--hi:#c4f7cf;width:64px;height:64px;border-radius:50%;
      background:radial-gradient(circle at 45% 38%,var(--hi),var(--c) 70%);
      box-shadow:0 0 26px 6px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 0 1px rgba(0,0,0,.06)}
  .light.amber{--c:#f2b13c;--hi:#fde3ad}
  .light.red{--c:#ec6a5c;--hi:#fbc6bf}

  /* the one button */
  .btn{width:116px;height:116px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
       background:repeating-linear-gradient(100deg,rgba(0,0,0,.04) 0 2px,transparent 2px 8px),
                  radial-gradient(circle at 40% 30%,#ecc898,var(--oak) 60%,var(--oak-dark));
       box-shadow:0 0 0 6px #f3eee6,0 0 0 9px rgba(242,177,60,.8),0 6px 0 9px #e3c58f,0 14px 22px 6px rgba(0,0,0,.18)}
  .btn svg{width:36px;height:36px}
  .btn span{font-weight:800;font-size:17px;letter-spacing:.06em;color:var(--ink)}

  /* states legend */
  .legend{display:flex;gap:30px;justify-content:center;padding:18px 0 8px}
  .state{display:flex;align-items:center;gap:10px;font-size:14px}
  .state .light{width:24px;height:24px;box-shadow:0 0 10px 2px color-mix(in srgb,var(--c) 50%,transparent)}
  .state b{display:block;font-size:15px}
  .state small{color:var(--muted-foreground,#888)}
</style></head>
<body>
<div class="stage">
  <div class="view">
    <div class="wall"><div class="scene"><div class="box"></div></div></div>
    <div class="cap">FRONT</div>
  </div>
  <div class="view">
    <div class="wall"><div class="scene"><div class="box angled"><div class="top"></div><div class="side"></div></div></div></div>
    <div class="cap">3/4 — OAK BOX, ~7 CM DEEP</div>
  </div>
</div>
<div class="legend">
  <div class="state"><div class="light"></div><div><b>Green</b><small>Caller verified</small></div></div>
  <div class="state"><div class="light amber"></div><div><b>Amber</b><small>Checking…</small></div></div>
  <div class="state"><div class="light red"></div><div><b>Red</b><small>Don't trust it</small></div></div>
</div>
<script>
const phone='<svg viewBox="0 0 24 24" fill="#2b2622"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const face=`<div class="face"><div class="light"></div><div class="btn">${phone}<span>CHECK</span></div></div>`;
document.querySelectorAll('.box').forEach(b=>b.insertAdjacentHTML('beforeend',face));
</script>
</body></html>
