name: scam_call_guardian
board: 14port
# Scam Call Guardian: mic -> Deepgram live STT (TLS WebSocket) -> Claude Haiku
# verdict (HTTPS) -> traffic light on three grids + status screen. Everything runs
# on the board. Secrets: `uv run python board/gen_secrets.py` (see GUARDIAN.md).
#
# Version 2 adds BLE setup from the phone, a local API on the home Wi-Fi (HTTP +
# WebSocket + mDNS), an event log in LittleFS, family security words and settings
# in NVS. The protocol is docs/protocol.md; the parts live in board/guardian/*.h,
# included below the same way as secrets.h.
libraries:
  - links2004/WebSockets@^2.6.1
  - bblanchon/ArduinoJson@^7.2.0
modules:
  - {id: microphone, instance: microphone, ports: [5, 6]}
  - {id: button,     instance: button,     port: 7}
  # Port 12 is the Reset button on this board, so the three grids sit in the
  # three slots above it (9, 10, 11). Red is next to the screen, green on top.
  # If the colours come out in the wrong grids, swap these three port numbers.
  - {id: neopixel,   instance: led_green,  port: 9}
  - {id: neopixel,   instance: led_yellow, port: 10}
  - {id: neopixel,   instance: led_red,    port: 11}
  - {id: st7735_tft, instance: st7735_tft, ports: [13, 14]}
code:
  globals: |
    #include <WiFi.h>
    #include <WiFiClientSecure.h>
    #include <HTTPClient.h>
    #include <WebSocketsClient.h>
    #include <ArduinoJson.h>
    #include <nvs.h>
    // Listed here (not only in board/guardian/*.h) so PlatformIO finds the libraries.
    #include <Preferences.h>
    #include <LittleFS.h>
    #include <WebServer.h>
    #include <WebSocketsServer.h>
    #include <ESPmDNS.h>
    #include <BLEDevice.h>
    #include "freertos/stream_buffer.h"
    #include "freertos/queue.h"
    #include "freertos/semphr.h"

    // board/secrets.h is generated from .env and git-ignored. From
    // board/build/src/main.cpp, "../../secrets.h" is board/secrets.h.
    #if __has_include("../../secrets.h")
    #include "../../secrets.h"
    #else
    #error "board/secrets.h missing: run `uv run python board/gen_secrets.py` from the repo root"
    #endif

    #include "../../guardian/sg_settings.h"   // settings, saved Wi-Fi, device token (NVS)

    // ---------------- configuration ----------------
    static const char* SG_DG_HOST = "api.deepgram.com";
    static const char* SG_CLAUDE_URL   = "https://api.anthropic.com/v1/messages";
    static const char* SG_CLAUDE_MODEL = "claude-haiku-5-5";
    static const size_t   SG_AUDIO_BUF_BYTES = 16000;  // 0.5 s of 16 kHz 16-bit mono (heap is tight)
    static const size_t   SG_AUDIO_CHUNK     = 3200;   // 100 ms per WebSocket frame
    static const size_t   SG_TRANSCRIPT_MAX  = 2400;   // rolling window (bytes)
    static const size_t   SG_SEGMENT_MAX     = 800;    // one Deepgram segment, after redaction

    static const char* SG_SYSTEM_PROMPT =
        "You are a real-time phone-scam detector protecting a person in Norway. You get a "
        "live speech-to-text transcript of an ongoing phone call (Norwegian, English, or "
        "mixed; both speakers merged; may contain recognition errors). Judge whether the "
        "CALLER is attempting fraud. Strong scam signals: impersonating a bank (DNB, Nordea, "
        "SpareBank, 'security department'), BankID, Vipps, police (politiet), Økokrim, tax "
        "authority (Skatteetaten), NAV, Microsoft/Apple/tech support or a courier; claims the "
        "account is compromised or money is at risk; urgency or secrecy pressure; asking "
        "for codes, passwords, PINs, BankID codes or confirmations, card numbers, one-time "
        "codes; asking to install apps or give remote access (AnyDesk, TeamViewer); moving "
        "money to a 'safe account', crypto, or buying gift cards; investment or prize "
        "offers too good to be true. The family may have set up secret security words; "
        "the device checks them itself, and '[family word]' in the transcript marks where "
        "one was spoken. A verified family word is strong evidence the caller is that "
        "family member. Reply ONLY with compact JSON, no other text: "
        "{\"verdict\":\"safe\"|\"unsure\"|\"scam\",\"reason\":\"<max 8 words>\"}. Write the "
        "reason in the language the call is mostly in: Norwegian (bokmål) for a Norwegian "
        "call, English for an English call. Use \"safe\" only when the call is clearly "
        "ordinary; when in doubt or when there is too little context, use \"unsure\".";

    // ---------------- shared state ----------------
    enum SgVerdict : uint8_t { V_NONE = 0, V_SAFE, V_UNSURE, V_SCAM, V_AIERR };
    enum : uint8_t { SG_WIFI_NONE = 0, SG_WIFI_SAVED, SG_WIFI_FALLBACK };
    static volatile bool     g_guarding    = false;
    static volatile uint32_t g_session     = 0;      // bumps on every guard-on
    static volatile bool     g_wsConnected = false;
    static volatile bool     g_sttStarted  = false;  // Deepgram socket opened or opening
    static volatile uint32_t g_streamGen   = 0;      // bumps when the Deepgram stream drops
    static volatile bool     g_streamAudio = false;  // mic callback writes to buffer
    static volatile int      g_gain        = 8;      // digital mic gain
    static volatile uint32_t g_audioDropped = 0;     // bytes lost to a full buffer
    static volatile uint32_t g_audioSent   = 0;      // bytes sent to Deepgram
    static StreamBufferHandle_t g_audioBuf = nullptr;
    static QueueHandle_t     g_eventQ      = nullptr; // event lines, printed by loop()
    static QueueHandle_t     g_netQ        = nullptr; // the same lines, to the API task
    static SemaphoreHandle_t g_mtx         = nullptr; // guards strings below
    static SemaphoreHandle_t g_emitMtx     = nullptr; // seq numbers in order
    static String            g_transcript;            // rolling window
    static uint32_t          g_txtVersion  = 0;       // bumps when text is added
    static volatile uint8_t  g_verdict     = V_NONE;
    static String            g_reason;
    static volatile bool     g_scamLatched = false;
    static volatile uint32_t g_aiCalls = 0, g_aiLastMs = 0;
    static volatile int      g_aiLastHttp  = 0;
    static volatile int8_t   g_guardReq    = -1;      // set by the API, applied by loop()
    static volatile uint32_t g_restartAt   = 0;
    static volatile bool     g_setupMode   = false;
    static volatile uint8_t  g_wifiSource  = SG_WIFI_NONE;
    static volatile uint32_t g_seq         = 0;
    static uint32_t          g_seqSavedHw  = 0;
    // Family word heard in this call (under g_mtx). 0 = none.
    static int               g_wordMatchId = 0;
    static char              g_wordMatchName[25] = "";
    static uint8_t           g_wordMatched[8];
    static uint8_t           g_wordMatchedN = 0;

    // ---------------- boot mode ----------------
    // A software restart keeps this; power-on fills it with noise (ignored).
    #define SG_INTENT_SETUP 0x5E7A0001u
    #define SG_INTENT_SKIP  0x5E7A0002u
    RTC_NOINIT_ATTR static uint32_t g_bootIntent;
    static int8_t g_bootMode = -1;                    // 1 = setup mode, 0 = normal

    // Setup mode when asked for (long press, POST /setup) or when no Wi-Fi is saved,
    // unless the last setup was cancelled or timed out.
    static bool sgDecideSetupMode() {
      if (g_bootMode >= 0) return g_bootMode == 1;
      bool setup;
      if (g_bootIntent == SG_INTENT_SETUP) setup = true;
      else if (g_bootIntent == SG_INTENT_SKIP) setup = false;
      else {
        bool saved = false; nvs_handle_t h; size_t len = 0;
        if (nvs_open("sgwifi", NVS_READONLY, &h) == ESP_OK) {
          saved = nvs_get_str(h, "ssid", nullptr, &len) == ESP_OK && len > 1;
          nvs_close(h);
        }
        setup = !saved;
      }
      g_bootMode = setup ? 1 : 0;
      return setup;
    }
    // Called by the Arduino core before setup(), after NVS is up: false hands the
    // BLE controller's memory back to the heap for this whole boot.
    extern "C" bool bleInUse(void) { return sgDecideSetupMode(); }

    static void sgRequestSetup() { g_bootIntent = SG_INTENT_SETUP; g_restartAt = millis() + 400; }

    // ---------------- events (JSON lines, printed from loop only) ----------------
    // Tasks never touch Serial: the generated firmware prints its own events from
    // loop() in several print() calls, so whole lines are queued and loop prints them.
    // Buffer: [0] flags, [4..7] seq, then the JSON line.
    enum : uint8_t { SG_EV_NET = 1, SG_EV_LOG = 2 };
    static const size_t SG_EV_HDR = 8;

    static void sgEmit(const char* type, const char* key, JsonVariantConst value) {
      if (!g_eventQ || !g_emitMtx) return;
      JsonDocument doc;
      doc["type"] = "event";
      JsonObject p = doc["payload"].to<JsonObject>();
      p["event_type"] = type;
      p["key"] = key;
      p["value"] = value;
      p["source"] = "guardian";
      time_t t = time(nullptr);
      uint8_t flags = 0;
      if (sgEventEnabled(key)) { flags = SG_EV_NET; if (strcmp(key, "health")) flags |= SG_EV_LOG; }
      xSemaphoreTake(g_emitMtx, portMAX_DELAY);       // seq order == queue order
      uint32_t seq = g_seq + 1;
      p["seq"] = seq;
      p["ts"] = t > 1700000000 ? (uint32_t)t : 0;
      size_t len = measureJson(doc);
      char* line = (char*)malloc(SG_EV_HDR + len + 2);
      if (line) {
        serializeJson(doc, line + SG_EV_HDR, len + 1);
        line[SG_EV_HDR + len] = '\n'; line[SG_EV_HDR + len + 1] = 0;
        line[0] = (char)flags; memcpy(line + 4, &seq, 4);
        if (xQueueSend(g_eventQ, &line, 0) == pdTRUE) g_seq = seq;
        else free(line);
      }
      xSemaphoreGive(g_emitMtx);
    }
    static void sgEmitStr(const char* type, const char* key, const String& v) {
      JsonDocument d; d.set(v.c_str()); sgEmit(type, key, d.as<JsonVariantConst>());
    }
    static void sgEmitDoc(const char* type, const char* key, JsonDocument& d) {
      sgEmit(type, key, d.as<JsonVariantConst>());
    }
    static void sgFlushEvents() {
      char* line;
      for (int i = 0; i < 8 && xQueueReceive(g_eventQ, &line, 0) == pdTRUE; i++) {
        // seq survives restarts: the log holds the last logged one, NVS a
        // high-water mark saved before any number above it goes out, so a number
        // already sent (e.g. health) is never used again.
        uint32_t seq; memcpy(&seq, line + 4, 4);
        if (seq >= g_seqSavedHw) {
          g_seqSavedHw = seq + 256;
          Preferences p;
          if (p.begin("sg", false)) { p.putULong("seqhw", g_seqSavedHw); p.end(); }
        }
        const char* json = line + SG_EV_HDR;
        Serial.write((const uint8_t*)json, strlen(json));
        if (line[0] && g_netQ && xQueueSend(g_netQ, &line, 0) == pdTRUE) continue;
        free(line);
      }
    }

    #include "../../guardian/sg_words.h"      // family members, salted word hashes, matching
    #include "../../guardian/sg_eventlog.h"   // ring of ~500 events in LittleFS

    // ---------------- microphone tap (runs on the mic task, core 0) ----------------
    static int32_t g_dcQ8 = 0;
    static int16_t g_micOut[512];
    static void onMic(const int16_t* s, int count, void*) {
      if (!g_streamAudio || !g_audioBuf) return;
      int gain = g_gain;
      while (count > 0) {
        int n = count > 512 ? 512 : count;
        for (int i = 0; i < n; i++) {
          int32_t x = s[i];
          g_dcQ8 += ((x << 8) - g_dcQ8) >> 9;            // DC tracker (~30 ms)
          int32_t y = (x - (g_dcQ8 >> 8)) * gain;
          if (y > 32767) y = 32767; else if (y < -32768) y = -32768;
          g_micOut[i] = (int16_t)y;                       // ESP32 is little-endian
        }
        size_t want = (size_t)n * 2;
        size_t put = xStreamBufferSend(g_audioBuf, g_micOut, want, 0);
        if (put < want) g_audioDropped += (want - put);
        s += n; count -= n;
      }
    }

    // ---------------- Deepgram WebSocket (own task) ----------------
    static WebSocketsClient ws;
    static String g_dgAuthHeader;
    static String g_dgPath;

    // Session the open socket belongs to, and whether it is being closed. Results
    // arriving for an old session or after CloseStream are dropped so speech from
    // a previous call can never be judged as part of the new one.
    static volatile uint32_t g_wsSession = 0;
    static volatile bool     g_wsClosing = false;

    static void sgBuildDgPath() {
      g_dgPath = "/v1/listen?encoding=linear16&sample_rate=16000&channels=1"
                 "&smart_format=true&interim_results=false&endpointing=100";
      switch (g_cfg.lang) {
        case SG_LANG_NO: g_dgPath += "&model=nova-2&language=no"; break;
        case SG_LANG_EN: g_dgPath += "&model=nova-3&language=en"; break;
        default: g_dgPath += "&model=nova-3&language=multi&language_hint=no&language_hint=en"; break;
      }
    }

    static void sgAppendTranscript(const char* text, const char* lang) {
      // Spoken family words are found and replaced before the text goes anywhere.
      String clean;
      uint8_t ids[SG_MAX_MEMBERS]; char names[SG_MAX_MEMBERS][SG_NAME_MAX + 1];
      int found = sgWordsMatch(text, clean, ids, names, SG_MAX_MEMBERS);
      int fresh[SG_MAX_MEMBERS]; int nf = 0;
      // Bound what one segment can add (Deepgram allows long frames, and each
      // replaced word grows): keep its last SG_SEGMENT_MAX bytes, from a space.
      if (clean.length() > SG_SEGMENT_MAX) {
        int sp = clean.indexOf(' ', clean.length() - SG_SEGMENT_MAX);
        clean = clean.substring(sp < 0 ? clean.length() - SG_SEGMENT_MAX : sp + 1);
      }
      xSemaphoreTake(g_mtx, portMAX_DELAY);
      if (g_wsClosing || g_wsSession != g_session || !g_guarding) {
        xSemaphoreGive(g_mtx);
        return;
      }
      if (g_transcript.length()) g_transcript += ' ';
      g_transcript += clean;
      if (g_transcript.length() > SG_TRANSCRIPT_MAX) {
        int cut = g_transcript.indexOf(' ', g_transcript.length() - SG_TRANSCRIPT_MAX * 3 / 4);
        g_transcript.remove(0, cut < 0 ? g_transcript.length() - SG_TRANSCRIPT_MAX * 3 / 4 : cut + 1);
      }
      for (int k = 0; k < found; k++) {
        bool seen = false;
        for (int j = 0; j < g_wordMatchedN; j++) seen |= g_wordMatched[j] == ids[k];
        if (seen || g_wordMatchedN >= sizeof g_wordMatched) continue;
        g_wordMatched[g_wordMatchedN++] = ids[k];
        if (!g_wordMatchId) { g_wordMatchId = ids[k]; memcpy(g_wordMatchName, names[k], sizeof g_wordMatchName); }
        fresh[nf++] = k;
      }
      g_txtVersion++;
      xSemaphoreGive(g_mtx);
      JsonDocument d; d["text"] = clean; if (lang) d["lang"] = lang;
      sgEmitDoc("state", "transcript", d);
      for (int k = 0; k < nf; k++) {
        JsonDocument m; m["member_id"] = ids[fresh[k]]; m["member"] = names[fresh[k]];
        sgEmitDoc("state", "word_match", m);
      }
    }

    static void sgOnWs(WStype_t type, uint8_t* payload, size_t length) {
      switch (type) {
        case WStype_CONNECTED:
          g_wsConnected = true;
          xStreamBufferReset(g_audioBuf);
          g_streamAudio = true;
          sgEmitStr("state", "ws", "connected");
          break;
        case WStype_DISCONNECTED:
          g_streamGen++;
          if (g_wsConnected) sgEmitStr("state", "ws", "disconnected");
          g_wsConnected = false;
          g_streamAudio = false;
          // Monitoring is blind until the stream is back: a SAFE verdict must not
          // stay green meanwhile. A scam latch is kept.
          xSemaphoreTake(g_mtx, portMAX_DELAY);
          if (g_verdict == V_SAFE) { g_verdict = V_UNSURE; g_reason = "STT lost"; }
          xSemaphoreGive(g_mtx);
          break;
        case WStype_ERROR:
          sgEmitStr("log", "error", String("ws: ") + (payload && length ? String((const char*)payload).substring(0, 120) : String("error")));
          break;
        case WStype_TEXT: {
          JsonDocument filter;
          filter["type"] = true;
          filter["is_final"] = true;
          filter["channel"]["alternatives"][0]["transcript"] = true;
          filter["channel"]["alternatives"][0]["languages"] = true;
          filter["err_msg"] = true;
          filter["description"] = true;
          JsonDocument doc;
          if (deserializeJson(doc, payload, length, DeserializationOption::Filter(filter))) {
            sgEmitStr("log", "error", "dg: bad json");
            break;
          }
          const char* t = doc["type"] | "";
          if (strcmp(t, "Results") == 0) {
            if (!(doc["is_final"] | false)) break;
            const char* text = doc["channel"]["alternatives"][0]["transcript"] | "";
            if (!*text) break;                              // empty finals are common
            const char* lang = doc["channel"]["alternatives"][0]["languages"][0] | (const char*)nullptr;
            sgAppendTranscript(text, lang);
          } else if (strcmp(t, "Metadata") != 0) {
            const char* em = doc["err_msg"] | (const char*)nullptr;
            if (!em) em = doc["description"] | "";
            String m = String("dg ") + t + ": " + em;
            sgEmitStr("log", "ws_msg", m.substring(0, 160));
          }
          break;
        }
        default: break;
      }
    }

    static void sgWsTask(void*) {
      static uint8_t chunk[SG_AUDIO_CHUNK];
      bool started = false;
      uint32_t closeAt = 0, lastSend = 0, lastKA = 0;
      for (;;) {
        uint32_t now = millis();
        bool wifiOk = WiFi.status() == WL_CONNECTED;
        if (g_guarding && wifiOk && !started) {
          // No CA and no fingerprint: the library calls setInsecure(). Empty
          // protocol: no Sec-WebSocket-Protocol header. The language setting takes
          // effect here, on the next connect.
          sgBuildDgPath();
          ws.beginSSL(SG_DG_HOST, 443, g_dgPath.c_str(), "", "");
          ws.onEvent(sgOnWs);
          ws.setExtraHeaders(g_dgAuthHeader.c_str());
          ws.setReconnectInterval(3000);
          g_wsSession = g_session; g_wsClosing = false;
          started = true; g_sttStarted = true; closeAt = 0; lastSend = lastKA = now;
          sgEmitStr("state", "ws", "connecting");
        }
        // Once closing has started it always runs to the end, even if guarding
        // came back on meanwhile (quick off/on); a new session also forces a fresh
        // socket. The next pass then reopens for the current session.
        if (started && (closeAt || !g_guarding || !wifiOk || g_wsSession != g_session)) {
          g_wsClosing = true;
          if (g_wsConnected && closeAt == 0) {
            g_streamAudio = false;
            ws.sendTXT("{\"type\":\"CloseStream\"}");
            closeAt = now ? now : 1;
            sgEmitStr("state", "ws", "closing");
          }
          if (!g_wsConnected || now - closeAt > 1500) {
            ws.disconnect();
            started = false; g_sttStarted = false; closeAt = 0;
            g_wsConnected = false; g_streamAudio = false;
            sgEmitStr("state", "ws", "closed");
          }
        }
        if (started) ws.loop();
        if (started && g_wsConnected && g_guarding && closeAt == 0) {
          // At most two frames per pass: ws.loop() must keep running to read
          // Deepgram's results and to notice guard-off / disconnects.
          for (int k = 0; k < 2 && xStreamBufferBytesAvailable(g_audioBuf) >= SG_AUDIO_CHUNK; k++) {
            size_t n = xStreamBufferReceive(g_audioBuf, chunk, SG_AUDIO_CHUNK, 0);
            if (!n) break;
            if (!ws.sendBIN(chunk, n)) { sgEmitStr("log", "error", "ws: send failed"); break; }
            g_audioSent += n; lastSend = millis();
          }
          now = millis();
          if (now - lastSend > 4000 && now - lastKA > 4000) {   // audio stalled
            ws.sendTXT("{\"type\":\"KeepAlive\"}");
            lastKA = now;
          }
        }
        vTaskDelay(pdMS_TO_TICKS(started ? 3 : 50));
      }
    }

    // ---------------- Claude verdicts (own task) ----------------
    static uint8_t sgParseVerdict(const String& text, String& reason) {
      int a = text.indexOf('{'), b = text.lastIndexOf('}');
      if (a < 0 || b <= a) return V_AIERR;
      JsonDocument v;
      if (deserializeJson(v, text.substring(a, b + 1))) return V_AIERR;
      String verdict = v["verdict"] | "";
      verdict.toLowerCase();
      reason = v["reason"] | "";
      if (verdict == "scam") return V_SCAM;
      if (verdict == "safe") return V_SAFE;
      if (verdict == "unsure") return V_UNSURE;
      return V_AIERR;
    }

    static void sgAiTask(void*) {
      static WiFiClientSecure tls;
      tls.setInsecure();                 // hackathon: no certificate pinning
      tls.setHandshakeTimeout(12);       // seconds (the default is 120)
      uint32_t lastVersion = 0, lastCall = 0, lastSession = 0;
      int failStreak = 0;                // consecutive failed calls this session
      for (;;) {
        vTaskDelay(pdMS_TO_TICKS(200));
        uint32_t session = g_session;
        if (session != lastSession) { lastSession = session; lastVersion = 0; lastCall = 0; failStreak = 0; }
        if (!g_guarding || g_scamLatched || WiFi.status() != WL_CONNECTED) continue;
        if (lastCall && millis() - lastCall < g_cfg.aiIntervalS * 1000UL) continue;
        String text; uint32_t ver; int matchId; char matchName[SG_NAME_MAX + 1];
        xSemaphoreTake(g_mtx, portMAX_DELAY);
        ver = g_txtVersion; text = g_transcript;
        matchId = g_wordMatchId; memcpy(matchName, g_wordMatchName, sizeof matchName);
        xSemaphoreGive(g_mtx);
        if (ver == lastVersion || text.length() == 0) continue;
        // A new TLS session needs ~17 KB blocks and ~40 KB in all; skip the call
        // rather than run out mid-handshake.
        if (!tls.connected() && (ESP.getMaxAllocHeap() < 20000 || ESP.getFreeHeap() < 45000)) {
          lastCall = millis();
          sgEmitStr("log", "error", String("ai: low heap, skipped (free ") + ESP.getFreeHeap() +
                                    ", max block " + ESP.getMaxAllocHeap() + ")");
          continue;
        }
        uint32_t streamGen = g_streamGen;
        // lastVersion only advances on a valid verdict (below), so a failed call
        // is retried after the AI interval even if no new speech arrives.
        lastCall = millis();

        JsonDocument req;
        req["model"] = SG_CLAUDE_MODEL;
        req["max_tokens"] = 120;
        req["thinking"]["type"] = "disabled";
        req["system"] = SG_SYSTEM_PROMPT;
        JsonObject m = req["messages"].add<JsonObject>();
        m["role"] = "user";
        String content;
        if (matchId) {
          // Only the fact of a match goes to Claude, never the word.
          content = String("Device check: the caller said the secret family security word "
                           "registered for the family member \"") + matchName + "\". This "
                    "strongly indicates the caller really is that family member. Lean towards "
                    "safe unless they push for codes, passwords, remote access or money "
                    "transfers to unknown accounts.\n\n";
        }
        content += "Live call transcript so far:\n";
        content += text;
        m["content"] = content;
        content = String();
        String body; serializeJson(req, body);
        req.clear();

        uint32_t t0 = millis();
        HTTPClient http;
        http.setTimeout(15000);
        http.setConnectTimeout(8000);
        int code = -1; String resp;
        if (http.begin(tls, SG_CLAUDE_URL)) {
          http.addHeader("content-type", "application/json");
          http.addHeader("x-api-key", SG_ANTHROPIC_API_KEY);
          http.addHeader("anthropic-version", "2023-06-01");
          code = http.POST(body);
          if (code > 0) resp = http.getString();
          http.end();
        }
        if (code < 0) tls.stop();        // stale keep-alive socket: reconnect next time
        body = String();
        uint32_t ms = millis() - t0;
        g_aiCalls++; g_aiLastMs = ms; g_aiLastHttp = code;

        String reason, modelText; uint8_t v = V_AIERR;
        if (code == 200) {
          JsonDocument filter;
          filter["content"][0]["type"] = true;
          filter["content"][0]["text"] = true;
          JsonDocument r;
          if (!deserializeJson(r, resp, DeserializationOption::Filter(filter))) {
            for (JsonObject c : r["content"].as<JsonArray>()) {
              if (strcmp(c["type"] | "", "text") == 0) { modelText = c["text"] | ""; break; }
            }
            v = sgParseVerdict(modelText, reason);
            if (v == V_AIERR) reason = "bad reply";
          } else reason = "bad json";
        } else {
          reason = code > 0 ? String("HTTP ") + code : String("net ") + code;
        }
        if (v == V_AIERR) failStreak++; else { failStreak = 0; lastVersion = ver; }

        // Session check under the same mutex loop() uses to reset state and bump
        // the session, so a verdict from a previous call can never land in this one.
        xSemaphoreTake(g_mtx, portMAX_DELAY);
        bool current = session == g_session && g_guarding;
        // A SAFE that comes back after the speech stream dropped would show green
        // while the board hears nothing: show it as UNSURE instead.
        if (v == V_SAFE && (streamGen != g_streamGen || !g_wsConnected)) { v = V_UNSURE; reason = "STT lost"; }
        if (current && !g_scamLatched) {
          if (v != V_AIERR) {
            g_verdict = v; g_reason = reason;
            if (v == V_SCAM && g_cfg.redLatch) g_scamLatched = true;
          } else if (g_verdict == V_NONE || g_verdict == V_AIERR || failStreak >= 3) {
            // One transient error keeps the last verdict; show "AI err" only with
            // nothing to show yet or after 3 failures in a row.
            g_verdict = V_AIERR; g_reason = reason;
          }
        }
        xSemaphoreGive(g_mtx);
        if (!current) continue;                              // guard toggled meanwhile

        static const char* names[] = {"none", "safe", "unsure", "scam", "ai_error"};
        JsonDocument d;
        d["verdict"] = names[v];
        d["reason"] = reason;
        d["latched"] = (bool)g_scamLatched;
        d["http"] = code;
        d["ms"] = ms;
        d["chars"] = text.length();
        d["word_match"] = matchId != 0;
        if (v == V_AIERR && resp.length()) d["detail"] = resp.substring(0, 200);
        sgEmitDoc("state", "verdict", d);
      }
    }

    #include "../../guardian/sg_api.h"        // HTTP :80, WebSocket :81, mDNS (own task)
    #include "../../guardian/sg_ble.h"        // BLE setup mode

    // ---------------- display helpers ----------------
    // Dims a colour to the screen_brightness setting (the backlight is fixed on).
    static uint16_t sgDim(uint16_t c) {
      uint32_t p = g_cfg.screenPct;
      if (p >= 100) return c;
      uint32_t r = ((c >> 11) & 31) * p / 100, g = ((c >> 5) & 63) * p / 100, b = (c & 31) * p / 100;
      return (uint16_t)((r << 11) | (g << 5) | b);
    }
    static void sgText(const char* s, int16_t x, int16_t y, uint8_t size, uint16_t color) {
      st7735_tft.displayText(s, x, y, size, sgDim(color));
    }
    // The built-in font has no æøå: transliterate UTF-8 for the screen only.
    static String sgAscii(const String& in) {
      String out; out.reserve(in.length());
      for (size_t i = 0; i < in.length(); i++) {
        uint8_t c = in[i];
        if (c < 0x80) { out += (char)c; continue; }
        if (c == 0xC3 && i + 1 < in.length()) {
          uint8_t d = in[++i];
          switch (d) {
            case 0xA6: out += "ae"; break; case 0x86: out += "AE"; break;
            case 0xB8: out += 'o'; break;  case 0x98: out += 'O'; break;
            case 0xA5: out += 'a'; break;  case 0x85: out += 'A'; break;
            case 0xA4: out += 'a'; break;  case 0xB6: out += 'o'; break;
            case 0xA9: out += 'e'; break;  case 0xBC: out += 'u'; break;
            default: out += '?';
          }
        } else if (c >= 0xC0) {
          out += '?';
          while (i + 1 < in.length() && ((uint8_t)in[i + 1] & 0xC0) == 0x80) i++;
        }
      }
      return out;
    }

    // Word-wrap `text` into at most `maxLines` lines of `cols` chars; drawn at y.
    static void sgDrawWrapped(const String& text, int16_t y, int maxLines, uint16_t color, bool tail) {
      const int cols = 26;
      String lines[6]; int n = 0;
      String rest = text; rest.trim();
      while (rest.length() && n < 6) {
        if ((int)rest.length() <= cols) { lines[n++] = rest; break; }
        int cut = rest.lastIndexOf(' ', cols);
        if (cut <= 0) cut = cols;
        lines[n++] = rest.substring(0, cut);
        rest = rest.substring(cut); rest.trim();
      }
      int start = (tail && n > maxLines) ? n - maxLines : 0;
      for (int i = start, row = 0; i < n && row < maxLines; i++, row++)
        sgText(lines[i].c_str(), 2, y + row * 9, 1, color);
    }

    static void sgLightsOff() {
      led_green.clear(); led_yellow.clear(); led_red.clear();
      led_green.show(); led_yellow.show(); led_red.show();
    }

    // ---------------- Wi-Fi (normal mode) ----------------
    // The network saved from the phone first; the one compiled in from .env is the
    // fallback. With both, they take turns, two tries each.
    static uint8_t sgWifiPick(int attempt) {
      bool s = g_savedSsid.length() > 0, f = sgHasFallbackWifi();
      if (s && f) return (attempt / 2) % 2 == 0 ? SG_WIFI_SAVED : SG_WIFI_FALLBACK;
      return s ? SG_WIFI_SAVED : f ? SG_WIFI_FALLBACK : SG_WIFI_NONE;
    }
    static const char* sgWifiBegin(uint8_t src) {
      g_wifiSource = src;
      const char* ssid = src == SG_WIFI_SAVED ? g_savedSsid.c_str() : SG_WIFI_SSID;
      const char* pass = src == SG_WIFI_SAVED ? g_savedPass.c_str() : SG_WIFI_PASSWORD;
      if (src == SG_WIFI_NONE) return "";
      if (strlen(pass)) WiFi.begin(ssid, pass); else WiFi.begin(ssid);   // empty = open network
      return ssid;
    }

    // ---------------- loop, setup mode ----------------
    static void sgSetupModeLoop() {
      static EveryTimer frame, lights;
      static bool wasDown = true;                     // ignore a press held from the restart
      bool down = button.isPressed();
      if (down && !wasDown && !g_restartAt) {         // short press: cancel setup
        sgSetupEvent("cancelled");
        g_bootIntent = SG_INTENT_SKIP; g_restartAt = millis() + 300;
      }
      wasDown = down;
      if (sgSetupLoop() && !g_restartAt) {
        g_bootIntent = SG_INTENT_SKIP;                // a saved network now wins anyway
        g_restartAt = millis() + 200;
      }
      if (lights.ready(40)) {                         // fast blue breathe: setup
        led_green.clear(); led_red.clear(); led_yellow.clear();
        float ph = (millis() % 1200) / 1200.0f;
        float k = 0.5f - 0.5f * cosf(ph * 2.0f * PI);
        led_yellow.setAll(0, 0, (uint8_t)(10 + 140 * k));
        led_green.show(); led_yellow.show(); led_red.show();
      }
      if (frame.ready(250)) {
        st7735_tft.clear();
        sgText("SETUP", 2, 1, 2, ST7735_TFT::COLOR_CYAN);
        String id = String("Guardian-") + (g_deviceId + 9);
        sgText(id.c_str(), 160 - st7735_tft.textWidth(id.c_str()) - 2, 4, 1, ST7735_TFT::COLOR_WHITE);
        char code[16]; snprintf(code, sizeof code, "%06lu", (unsigned long)g_passkey);
        sgText("Code", 2, 27, 1, ST7735_TFT::COLOR_WHITE);
        sgText(code, 32, 21, 2, g_blePeer ? ST7735_TFT::COLOR_YELLOW : ST7735_TFT::COLOR_ORANGE);
        sgText(g_bleSecure ? "paired" : (g_blePeer ? "phone" : ""), 112, 27, 1, ST7735_TFT::COLOR_GREEN);
        sgDrawWrapped(sgAscii(g_setupLine), 44, 2, ST7735_TFT::COLOR_WHITE, false);
        sgText("Press button to cancel", 2, 70, 1, ST7735_TFT::COLOR_BLUE);
        st7735_tft.display();
      }
    }

    // ---------------- loop, normal mode ----------------
    static void sgNormalLoop(int want) {
      static EveryTimer frame, lights, stats;
      static uint32_t wifiBeganAt = 0, pressAt = 0;
      static int lastWifi = -1, wifiAttempt = 0;
      static bool longFired = false;
      uint32_t now = millis();

      // ---- button: short press toggles guarding, 5 s hold starts BLE setup ----
      bool down = button.isPressed();
      if (down && !pressAt) { pressAt = now ? now : 1; longFired = false; }
      if (down && pressAt && !longFired && now - pressAt >= 5000) {
        longFired = true;
        sgRequestSetup();
      }
      if (!down && pressAt) {
        if (!longFired && now - pressAt < 1500) want = g_guarding ? 0 : 1;
        pressAt = 0;
      }
      int8_t req = __atomic_exchange_n((int8_t*)&g_guardReq, (int8_t)-1, __ATOMIC_SEQ_CST);
      if (req >= 0) want = req;

      if (want >= 0 && (bool)want != g_guarding) {
        if (want) {
          xSemaphoreTake(g_mtx, portMAX_DELAY);
          g_transcript = ""; g_txtVersion = 0;
          g_verdict = V_NONE; g_reason = ""; g_scamLatched = false;
          g_wordMatchId = 0; g_wordMatchName[0] = 0; g_wordMatchedN = 0;
          g_session++;
          g_guarding = true;
          xSemaphoreGive(g_mtx);
        } else {
          g_guarding = false;
        }
        sgEmitStr("state", "guard", g_guarding ? "on" : "off");
      }

      // ---- Wi-Fi watchdog (non-blocking); the API needs Wi-Fi even when idle ----
      int ws_ = WiFi.status();
      if (ws_ != lastWifi) {
        lastWifi = ws_;
        JsonDocument d;
        d["status"] = ws_ == WL_CONNECTED ? "connected" : (ws_ == WL_NO_SSID_AVAIL ? "no_ssid" : (ws_ == WL_CONNECT_FAILED ? "failed" : "down"));
        d["code"] = ws_;
        if (ws_ == WL_CONNECTED) { d["ip"] = WiFi.localIP().toString(); d["rssi"] = WiFi.RSSI(); wifiAttempt = 0; }
        d["source"] = g_wifiSource == SG_WIFI_SAVED ? "saved" : g_wifiSource == SG_WIFI_FALLBACK ? "fallback" : "none";
        sgEmitDoc("state", "wifi", d);
      }
      if (ws_ != WL_CONNECTED && g_wifiSource != SG_WIFI_NONE && now - wifiBeganAt > 15000) {
        WiFi.disconnect();
        const char* ssid = sgWifiBegin(sgWifiPick(++wifiAttempt));
        wifiBeganAt = now;
        sgEmitStr("log", "wifi_retry", ssid);
      }

      // ---- traffic light ----
      if (lights.ready(40)) {
        uint8_t v = g_verdict;
        led_green.clear(); led_yellow.clear(); led_red.clear();
        if (g_guarding) {
          if (v == V_SCAM)        led_red.setAll(255, 0, 0);
          else if (v == V_SAFE)   led_green.setAll(0, 255, 0);
          else if (v == V_UNSURE || v == V_AIERR) led_yellow.setAll(255, 150, 0);
          else if (g_wsConnected) {                     // listening: slow blue breathe
            float ph = (millis() % 2400) / 2400.0f;
            float k = 0.5f - 0.5f * cosf(ph * 2.0f * PI);
            led_yellow.setAll(0, 0, (uint8_t)(10 + 110 * k));
          } else if ((millis() / 400) % 2) {            // connecting: blink centre
            led_yellow.setPixel(4, 60, 60, 60);
          }
        }
        led_green.show(); led_yellow.show(); led_red.show();
      }

      // ---- screen ----
      if (frame.ready(250)) {
        st7735_tft.clear();
        bool wifiUp = WiFi.status() == WL_CONNECTED;
        String st = String(wifiUp ? "W+" : "W-") + (g_wsConnected ? " STT+" : " STT-");
        if (pressAt && now - pressAt >= 1500) {
          char msg[24]; snprintf(msg, sizeof msg, "%lu", (unsigned long)((5000 - min<uint32_t>(5000, now - pressAt) + 999) / 1000));
          sgText("Hold for setup", 2, 10, 2, ST7735_TFT::COLOR_CYAN);
          sgText(msg, 72, 40, 3, ST7735_TFT::COLOR_YELLOW);
        } else if (!g_guarding) {
          sgText("Scam Guardian", 2, 4, 1, ST7735_TFT::COLOR_CYAN);
          sgText(st.c_str(), 160 - st7735_tft.textWidth(st.c_str()) - 2, 4, 1, ST7735_TFT::COLOR_WHITE);
          sgText("Press button", 8, 24, 2, ST7735_TFT::COLOR_WHITE);
          sgText("to guard", 32, 44, 2, ST7735_TFT::COLOR_WHITE);
          if (g_wifiSource == SG_WIFI_NONE) sgText("No WiFi: hold 5s = setup", 2, 70, 1, ST7735_TFT::COLOR_ORANGE);
          else if (wifiUp) sgText(WiFi.localIP().toString().c_str(), 2, 70, 1, ST7735_TFT::COLOR_BLUE);
        } else {
          uint8_t v = g_verdict;
          const char* big = "LISTENING"; uint16_t col = ST7735_TFT::COLOR_CYAN;
          if (!wifiUp)                        { big = "WiFi..."; col = ST7735_TFT::COLOR_WHITE; }
          else if (!g_wsConnected && v == V_NONE) { big = "CONNECT"; col = ST7735_TFT::COLOR_WHITE; }
          if (v == V_SCAM)   { big = "SCAM!";  col = ST7735_TFT::COLOR_RED; }
          if (v == V_SAFE)   { big = "SAFE";   col = ST7735_TFT::COLOR_GREEN; }
          if (v == V_UNSURE) { big = "UNSURE"; col = ST7735_TFT::COLOR_YELLOW; }
          if (v == V_AIERR)  { big = "AI err"; col = ST7735_TFT::COLOR_YELLOW; }
          sgText(big, 2, 1, 2, col);
          String reason, tail; bool fam;
          xSemaphoreTake(g_mtx, portMAX_DELAY);
          reason = g_reason; fam = g_wordMatchId != 0;
          int from = (int)g_transcript.length() - 110;
          tail = g_transcript.substring(from < 0 ? 0 : from);
          xSemaphoreGive(g_mtx);
          if (fam) st += " F";
          sgText(st.c_str(), 160 - st7735_tft.textWidth(st.c_str()) - 2, 1, 1, ST7735_TFT::COLOR_WHITE);
          if (from > 0) { int sp = tail.indexOf(' '); if (sp >= 0) tail = tail.substring(sp + 1); }
          sgDrawWrapped(sgAscii(reason), 19, 2, col, false);
          st7735_tft.drawLine(0, 38, 159, 38, sgDim(ST7735_TFT::COLOR_BLUE));
          sgDrawWrapped(tail.length() ? sgAscii(tail) : String("(waiting for speech)"), 42, 4, ST7735_TFT::COLOR_WHITE, true);
        }
        st7735_tft.display();
      }

      // ---- periodic health event ----
      if (stats.ready(g_guarding ? 5000 : 30000)) {
        JsonDocument d;
        d["guarding"] = (bool)g_guarding;
        d["free_heap"] = ESP.getFreeHeap();
        d["min_free_heap"] = ESP.getMinFreeHeap();
        d["max_block"] = ESP.getMaxAllocHeap();
        d["audio_buf"] = (uint32_t)xStreamBufferBytesAvailable(g_audioBuf);
        d["audio_sent"] = (uint32_t)g_audioSent;
        d["audio_dropped"] = (uint32_t)g_audioDropped;
        d["ai_calls"] = (uint32_t)g_aiCalls;
        d["ai_ms"] = (uint32_t)g_aiLastMs;
        d["mic_level"] = microphone.getSoundLevel();
        d["ws_clients"] = (int)g_wsClientCount;
        d["log_events"] = g_logEvents;
        d["degraded"] = g_degraded;
        sgEmitDoc("sensor", "health", d);
      }
    }
  setup: |
    g_setupMode = sgDecideSetupMode();
    g_bootIntent = 0;
    g_eventQ = xQueueCreate(32, sizeof(char*));
    g_netQ = xQueueCreate(32, sizeof(char*));
    g_mtx = xSemaphoreCreateMutex();
    g_emitMtx = xSemaphoreCreateMutex();
    sgInitDeviceId();
    sgLoadSettings();
    g_gain = g_cfg.micGain;
    sgLoadWifi();
    sgLoadToken();
    sgWordsLoad();
    bool logOk = sgLogBegin();
    {
      Preferences p;
      uint32_t hw = 0;
      if (p.begin("sg", true)) { hw = p.getULong("seqhw", 0); p.end(); }
      g_seq = max(hw, g_logLastSeq);
      g_seqSavedHw = g_seq;              // the first flush saves a new high-water mark
    }
    led_green.clear();  led_green.show();
    led_yellow.clear(); led_yellow.show();
    led_red.clear();    led_red.show();
    {
      JsonDocument d;
      d["fw"] = SG_FW_VERSION;
      static const char* const rr[] = {"UNKNOWN", "POWERON", "EXT", "SOFTWARE", "PANIC", "INT_WDT",
                                       "TASK_WDT", "WDT", "DEEPSLEEP", "BROWNOUT", "SDIO"};
      int r = (int)esp_reset_reason();
      d["reason"] = r >= 0 && r < 11 ? rr[r] : "UNKNOWN";
      d["free_heap"] = ESP.getFreeHeap();
      d["mode"] = g_setupMode ? "setup" : "normal";
      d["log_events"] = g_logEvents;
      d["device"] = g_deviceId;
      sgEmitDoc("state", "startup", d);
      if (!logOk) sgEmitStr("log", "error", "littlefs: mount failed, no event log");
    }
    WiFi.mode(WIFI_STA);
    // The API task writes the event log in both modes; it starts the servers once
    // Wi-Fi is up in normal mode.
    xTaskCreatePinnedToCore(sgApiTask, "sg_api", 8192, nullptr, 1, nullptr, 1);
    if (g_setupMode) {
      sgBleBegin();
    } else {
      g_audioBuf = xStreamBufferCreate(SG_AUDIO_BUF_BYTES, SG_AUDIO_CHUNK);
      g_dgAuthHeader = String("Authorization: Token ") + SG_DEEPGRAM_API_KEY;
      g_transcript.reserve(SG_TRANSCRIPT_MAX + 400);
      WiFi.setSleep(false);            // modem sleep adds latency to the audio stream
      WiFi.setAutoReconnect(true);
      sgWifiBegin(sgWifiPick(0));
      microphone.onAudio(onMic, nullptr);
      xTaskCreatePinnedToCore(sgWsTask, "sg_ws", 8192, nullptr, 1, nullptr, 0);
      xTaskCreatePinnedToCore(sgAiTask, "sg_ai", 12288, nullptr, 1, nullptr, 0);
    }
  loop: |
    // ---- USB actions (atech send ...) ----
    int want = -1;
    if (atech_action == "guard") {
      String v = atech_value; v.trim(); v.toLowerCase();
      if (g_setupMode) atechFail("in setup mode");
      else if (v == "on" || v == "1" || v == "true") want = 1;
      else if (v == "off" || v == "0" || v == "false") want = 0;
      else if (v == "" || v == "toggle") want = g_guarding ? 0 : 1;
      else atechFail("value must be on, off or toggle");
      atechDone();
    }
    if (atech_action == "gain") {
      int g = atech_value.toInt();
      if (g >= 1 && g <= 64) {
        SgSettings n = g_cfg; n.micGain = g;
        if (sgSaveSettings(n)) { g_cfg.micGain = g; g_gain = g; } else atechFail("could not save");
      }
      else atechFail("gain must be 1..64");
      atechDone();
    }
    if (atech_action == "setup") {          // same as holding the button for 5 s
      sgRequestSetup();
      atechDone();
    }
    if (atech_action == "setup_cancel") {   // same as a short press in setup mode
      if (!g_setupMode) atechFail("not in setup mode");
      else {
        sgSetupEvent("cancelled");
        g_bootIntent = SG_INTENT_SKIP; g_restartAt = millis() + 300;
      }
      atechDone();
    }
    if (atech_action == "api_token") {
      // A new device token for testing the API from the laptop. Printed on USB
      // only, never through sgEmit (so never to the network or the log). The
      // phone's token stops working.
      String t = sgNewToken();
      if (!t.length()) atechFail("could not save the token");
      else Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"api_token\",\"value\":\"%s\",\"source\":\"guardian\"}}\n", t.c_str());
      t = String();
      atechDone();
    }

    if (g_restartAt && (int32_t)(millis() - g_restartAt) >= 0) {
      sgLightsOff();
      sgFlushEvents();
      Serial.flush();
      ESP.restart();
    }
    if (g_setupMode) sgSetupModeLoop();
    else sgNormalLoop(want);

    sgFlushEvents();
