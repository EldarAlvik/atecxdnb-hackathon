[project]
name = "atecxdnb-hackathon"
version = "0.1.0"
description = "ATEC x DNB hackathon project using the Atech Python SDK"
requires-python = ">=3.12"
dependencies = [
    "atech>=1.0.0a12",
]

[dependency-groups]
mock = ["aiohttp>=3.10"]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["simboard.py"]
